services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: xraygpt
      POSTGRES_USER: xraygpt
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xraygpt"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xraygpt-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - xraygpt-network

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - xraygpt-network

  spark:
    image: bitnami/spark:3.3.0
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./etl:/opt/spark-apps
      - ./data:/data
    networks:
      - xraygpt-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.3.0
    ports:
      - "6000:6000"
    command: mlflow server --host 0.0.0.0 --port 6000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./artifacts
    volumes:
      - mlflow_data:/mlflow
    networks:
      - xraygpt-network

  prometheus:
    image: prom/prometheus:v2.42.0
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/monitoring/prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - xraygpt-network

  grafana:
    image: grafana/grafana:9.4.3
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./k8s/monitoring/grafana-dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml
    networks:
      - xraygpt-network

  # Comment out the services that need building for now
  # etl-processor:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.etl
  #   ...

  # trainer:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.training
  #   ...

  # api:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.serving
  #   ...

volumes:
  postgres_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

networks:
  xraygpt-network:
    driver: bridge