apiVersion: apps/v1
kind: Deployment
metadata:
  name: xraygpt-serving
  namespace: xraygpt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: fastapi-server
        image: xraygpt/serving:latest
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_PATH
          value: "/models/xraygpt-latest.onnx"
        - name: POSTGRES_CONNECTION
          valueFrom:
            secretKeyRef:
              name: xraygpt-secrets
              key: postgres-connection
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10