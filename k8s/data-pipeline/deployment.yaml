apiVersion: apps/v1
kind: Deployment
metadata:
  name: xraygpt-data-pipeline
  namespace: xraygpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-pipeline
  template:
    metadata:
      labels:
        app: data-pipeline
    spec:
      containers:
      - name: etl-processor
        image: xraygpt/etl-processor:latest
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: xraygpt-config
              key: kafka-bootstrap-servers
        - name: SPARK_MASTER
          value: "spark://spark-master:7077"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: xraygpt-data-pvc