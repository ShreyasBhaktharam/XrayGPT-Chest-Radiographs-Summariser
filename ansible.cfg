[defaults]
stdout_callback = yaml
inventory = inventory.ini 

# Add these configurations to improve reliability
host_key_checking = False
timeout = 60
internal_poll_interval = 0.5
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./ansible_facts_cache
fact_caching_timeout = 86400
retry_files_enabled = False

# Enable longer timeouts for module execution
module_set_timeout = 300

[ssh_connection]
# Maintain your existing proxy command but add additional reliability settings
ssh_args = -o StrictHostKeyChecking=off -o UserKnownHostsFile=/dev/null -o ForwardAgent=yes -o ControlMaster=no -o ControlPersist=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ProxyCommand="ssh -i ~/.ssh/id_rsa_chameleon -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p cc@129.114.27.92"

# Add these settings to improve SSH connection stability
pipelining = True
retries = 5
timeout = 120

[persistent_connection]
command_timeout = 300
connect_timeout = 60
connect_retry_timeout = 30